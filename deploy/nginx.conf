# HTTP 仅保留 ACME 校验与容器内健康检查，其余请求 301 跳转到 HTTPS
server {
    listen 80;
    server_name cbec.628101.xyz _;

    # Let's Encrypt HTTP-01 校验与证书续期，必须绕过跳转
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 发布脚本健康检查走 http://127.0.0.1:8080/api/health，不能返回 301
    location = /api/health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cbec.628101.xyz;

    ssl_certificate     /etc/letsencrypt/live/cbec.628101.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbec.628101.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    # LLM 问答、Excel / OCR 解析等接口可能超过默认 60s，给足后端处理时间
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 基础安全响应头（静态资源与反代响应统一继承）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    # 不加 includeSubDomains：主域名下可能还有其他走 HTTP 的子站
    add_header Strict-Transport-Security "max-age=15552000" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 箱唛导出产物（PDF / PNG）直链，由后端 StaticFiles 提供
    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite 打包产物文件名带内容指纹，可长期缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
    }

    # 入口 HTML 每次回源校验，避免前端发版后浏览器仍沿用旧资源清单
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
