services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cbec
      POSTGRES_USER: cbec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbec123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbec"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://cbec:${POSTGRES_PASSWORD:-cbec123}@postgres:5432/cbec
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
